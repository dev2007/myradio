name: Build and Deploy

# GitHub 境外 runner 构建：拉 GitHub/docker.io/npmjs 均就近；
# 产物推送 ACR，ECS 在国内走内网拉取。与 myweixinmp 的部署体系同构。

on:
  push:
    branches: [main]
    # 仅应用代码/Dockerfile/依赖清单变化才触发构建部署；
    # docs、deploy/、.github/ 等变更不触发
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_DEPLOY_DIR: ${{ secrets.ECS_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          DEPLOY_DIR_QUOTED="$(printf '%q' "$ECS_DEPLOY_DIR")"
          ssh -i ~/.ssh/deploy_key \
              -p "${ECS_PORT:-22}" \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$ECS_USER@$ECS_HOST" \
              "cd $DEPLOY_DIR_QUOTED && docker compose pull && docker compose up -d"
