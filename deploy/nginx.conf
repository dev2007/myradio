# 示例：在 Next.js 容器前用 Nginx 终止 TLS。
# 把证书放到 ./certs/fullchain.pem 与 ./certs/privkey.pem，再挂载本文件。
# upstream 为 myradio compose 服务的别名 radio（http://radio:3000）。

server {
    listen 80;
    server_name radio.example.com;
    # 证书签发前的临时校验可用：return 301 https://$host$request_uri;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name radio.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://radio:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
